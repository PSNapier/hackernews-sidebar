<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HN Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
  <script type="module" src="sidebar.js"></script>
</head>
<body>
  <div class="rail">
    <button id="rail-close" class="rail-close" type="button" title="Close sidebar" aria-label="Close sidebar">×</button>
    <button id="rail" class="rail-expand" type="button" title="Expand sidebar" aria-label="Expand sidebar">
      <span class="rail-arrow" aria-hidden="true">‹</span>
      <span class="rail-label" aria-hidden="true">HN</span>
    </button>
  </div>
  <header class="story">
    <h1 class="story-title"><a id="title" target="_blank" rel="noopener noreferrer">Loading…</a></h1>
    <p class="story-meta">
      <span id="meta"></span>
      <a id="hn-link" class="hn-link" target="_blank" rel="noopener noreferrer">Open on HN</a>
    </p>
    <div class="controls">
      <button id="collapse-all" type="button" disabled>Collapse all</button>
      <button id="refresh" type="button" disabled>Refresh</button>
      <button id="collapse-sidebar" class="collapse-sidebar" type="button" title="Collapse sidebar">Collapse</button>
      <button id="close-sidebar" type="button" title="Close sidebar" aria-label="Close sidebar">×</button>
    </div>
  </header>
  <main>
    <p id="status" class="status" role="status">Loading comments…</p>
    <div id="tree" class="tree"></div>
  </main>
</body>
</html>
